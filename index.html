<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素探索教育遊戲範本</title>
<style>
  :root {
    --bg: #181a2e;
    --frame: #2c3050;
    --ink: #20243c;
    --box: #f8f8f0;
    --box-line: #384870;
    --accent: #e04848;
    --good: #2f9e5a;
    --bad: #d04050;
    --muted: #9aa0c0;
    --text: #eef0ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  .shell { width: 100%; max-width: 760px; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f8d848; outline-offset: 2px; }

  /* 文字框:仿掌機遊戲的白底雙框 */
  .textbox {
    background: var(--box); color: var(--ink);
    border: 4px solid var(--box-line); border-radius: 8px;
    box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #b8c0d8;
    padding: 12px 16px; font-weight: 700; line-height: 1.6;
  }
  .btn {
    background: var(--box); color: var(--ink); border: 3px solid var(--box-line);
    border-radius: 8px; padding: 10px 18px; font-weight: 700;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: #902030; }

  /* 開始/結算畫面 */
  .screen { background: var(--frame); border-radius: 14px; padding: 22px 20px; }
  .screen h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: .05em; }
  .screen p.desc { color: var(--muted); margin: 0 0 16px; line-height: 1.7; }
  .lineup { display: block; width: 100%; image-rendering: pixelated; margin: 8px 0 16px; }
  .screen input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 3px solid var(--box-line);
    background: var(--box); color: var(--ink); font-size: 1rem; font-weight: 700; margin-bottom: 12px;
  }
  .screen .btn.primary { width: 100%; font-size: 1.1rem; }
  .best-note, .submit-status { color: var(--muted); font-size: .9rem; text-align: center; margin-top: 10px; }
  .map-errors { background: #3a1c28; border: 2px solid var(--bad); border-radius: 8px; padding: 10px 12px 10px 28px; margin: 0 0 14px; font-size: .9rem; line-height: 1.6; }
  .map-errors .title { list-style: none; margin-left: -16px; color: #ff9aa8; font-weight: 700; }
  .teacher-notes { background: #23263f; border: 1px solid #454a70; border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: .9rem; line-height: 1.7; }
  .teacher-notes summary { cursor: pointer; color: var(--muted); font-weight: 700; }
  .teacher-notes div { white-space: pre-line; margin-top: 6px; }
  .end-story { background: #23263f; border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; line-height: 1.8; white-space: pre-line; }
  .summary-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #454a70; }

  /* 遊戲畫面 */
  .stage { position: relative; margin: 0 auto; }
  .game-frame { position: relative; background: #000; border: 4px solid var(--frame); border-radius: 10px; overflow: hidden; }
  #view { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hud {
    position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; pointer-events: none;
  }
  .hud span { background: rgba(248,248,240,.92); color: var(--ink); border: 2px solid var(--box-line); border-radius: 6px; padding: 2px 8px; font-size: .8rem; font-weight: 700; }
  .toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: calc(100% - 20px); max-width: 520px; font-size: .95rem; pointer-events: none; }
  @media (max-width: 640px) { .toast { font-size: .8rem; bottom: 6px; width: calc(100% - 12px); padding: 6px 10px !important; } }

  /* 遇到角色的畫面 */
  .encounter { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; }
  #enc-scene { width: 100%; flex: 1; min-height: 0; image-rendering: pixelated; display: block; object-fit: cover; }
  .enc-box { position: absolute; left: 12px; right: 12px; bottom: 12px; max-height: 62%; overflow: auto; }
  @media (max-width: 560px) { .enc-box { position: static; margin-top: 8px; max-height: none; } }
  .enc-box .q { margin: 0 0 8px; white-space: pre-line; }   /* 題目、對話裡的換行字元會換行 */
  .choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .choices button {
    width: 100%; text-align: left; background: transparent; border: 0; padding: 6px 8px 6px 26px;
    font-weight: 700; color: var(--ink); border-radius: 6px; position: relative;
  }
  .choices button.sel { background: #e4e8f4; }
  .choices button.sel::before { content: "▶"; position: absolute; left: 8px; }
  .choices button:disabled { opacity: 1; cursor: default; }
  .choices button.correct { background: #cdeedb; color: #1c6a3c; }
  .choices button.wrong { background: #f6d2d8; color: #9a2436; }
  .enc-box .fb { margin: 6px 0 0; padding: 6px 10px; border-radius: 6px; background: #fff4d0; font-weight: 700; }
  .enc-box .fb.good { background: #dcf3e4; }
  .bag-list { list-style: none; margin: 0 0 6px; padding: 0; }
  .bag-list li { padding: 4px 0; border-bottom: 1px dashed #c8cce0; }
  .bag-list .note { display: block; font-weight: 400; font-size: .9rem; white-space: pre-line; }
  .bag-list .used { color: #8a90a8; }
  .enc-more { font-size: .8rem; color: #6a7090; text-align: right; }

  /* 觸控按鈕 */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; }
  .dpad button, .abtn { background: var(--frame); color: var(--text); border: 3px solid #4a5080; border-radius: 10px; font-size: 1.2rem; touch-action: none; }
  .dpad button.on, .abtn.on { background: #4a5080; }
  .btns { display: flex; align-items: center; gap: 12px; }
  .bbtn { width: 56px; height: 56px; border-radius: 50%; font-weight: 800; font-size: 1rem; background: var(--frame); color: var(--text); border: 3px solid #4a5080; }
  .abtn { width: 76px; height: 76px; border-radius: 50%; font-weight: 800; font-size: 1.4rem; background: var(--accent); border-color: #902030; }
  .hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 10px 0 0; }

  /* 圖片預覽頁(網址加上 #sprites 時顯示) */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
  .gallery figure { margin: 0; background: #78c850; border-radius: 8px; padding: 8px; text-align: center; }
  .gallery canvas { width: 64px; height: 64px; image-rendering: pixelated; }
  .gallery figcaption { color: #102010; font-size: .8rem; font-weight: 700; word-break: break-all; }
</style>
</head>
<body>
<div class="shell">

  <!-- ===== 畫面一:開始畫面 ===== -->
  <div id="screen-start" class="screen">
    <h1 id="game-title">🗺️ 像素探索大冒險</h1>
    <p class="desc" id="game-desc">在地圖上四處探索,找出躲起來的角色,答對問題就能收服牠們。走進草叢也可能突然遇到角色喔!</p>
    <canvas class="lineup" id="lineup" width="240" height="28"></canvas>
    <details class="teacher-notes hidden" id="teacher-notes"><summary>給老師</summary><div id="teacher-notes-body"></div></details>
    <ul class="map-errors hidden" id="map-errors"></ul>
    <input type="text" id="player-name" placeholder="請輸入姓名或暱稱" maxlength="20">
    <button class="btn primary" id="btn-start">開始冒險</button>
    <div class="best-note" id="best-note"></div>
  </div>

  <!-- ===== 畫面二:遊戲進行中 ===== -->
  <div id="screen-game" class="hidden">
    <div class="stage" id="stage">
    <div class="game-frame" id="game-frame">
      <canvas id="view" width="240" height="160"></canvas>
      <div class="hud"><span id="hud-creatures"></span><span id="hud-items"></span></div>
      <div class="toast textbox hidden" id="toast"></div>
      <div class="encounter hidden" id="encounter">
        <canvas id="enc-scene" width="240" height="160"></canvas>
      </div>
    </div>
    <!-- 問答框:寬螢幕疊在畫面下方,手機放在畫面下面 -->
    <div class="enc-box textbox hidden" id="enc-box"></div>
    </div>
    <div class="controls">
      <div class="dpad" id="dpad">
        <span></span><button data-dir="up" aria-label="上">▲</button><span></span>
        <button data-dir="left" aria-label="左">◀</button><span></span><button data-dir="right" aria-label="右">▶</button>
        <span></span><button data-dir="down" aria-label="下">▼</button><span></span>
      </div>
      <div class="btns"><button class="bbtn" id="btn-b" aria-label="背包">B</button><button class="abtn" id="btn-a" aria-label="確定 / 調查">A</button></div>
    </div>
    <p class="hint">方向鍵 / WASD 移動,Enter / 空白鍵確定,B 鍵 / B 鈕打開背包</p>
  </div>

  <!-- ===== 畫面三:結算畫面 ===== -->
  <div id="screen-end" class="screen hidden">
    <h1 id="end-title">🎉 全部收服完成!</h1>
    <canvas class="lineup" id="end-lineup" width="240" height="28"></canvas>
    <div class="end-story hidden" id="end-story"></div>
    <div class="summary-row"><span>玩家</span><span id="sum-name"></span></div>
    <div class="summary-row" id="row-creatures"><span id="lbl-creatures">收服角色</span><span id="sum-creatures"></span></div>
    <div class="summary-row" id="row-firsttry"><span id="lbl-firsttry">一次就答對</span><span id="sum-firsttry"></span></div>
    <div class="summary-row"><span>答錯次數</span><span id="sum-wrong"></span></div>
    <div class="summary-row" id="row-items"><span id="lbl-items">撿到道具</span><span id="sum-items"></span></div>
    <div class="summary-row"><span>走了幾步</span><span id="sum-moves"></span></div>
    <div class="summary-row"><span>花費時間</span><span id="sum-time"></span></div>
    <div class="submit-status" id="submit-status"></div>
    <button class="btn" id="btn-restart" style="width:100%;margin-top:14px">再玩一次</button>
  </div>

  <!-- ===== 圖片預覽頁(網址後面加 #sprites 才會出現,給製作者檢查圖用) ===== -->
  <div id="screen-gallery" class="screen hidden">
    <h1>圖片預覽</h1>
    <p class="desc">每張圖放大 4 倍、畫在草地上,檢查輪廓、顏色和辨識度。</p>
    <div class="gallery" id="gallery"></div>
  </div>

</div>

<!-- 程式分成三個 <script>(仍然是同一個檔案):
     1. 錯誤顯示:下面兩段只要有語法錯誤(漏逗號、引號或括號沒成對),就在開始畫面顯示第幾行出錯
     2. 設定與內容包:GAS_URL、STORAGE_KEY、CONTENT-PACK
     3. 像素圖與引擎
   分開寫是因為同一個 <script> 裡只要有一個語法錯誤,整段都不會執行,連錯誤訊息都顯示不出來。不要合併回去。 -->
<script>
(function () {
  let shown = false;
  window.addEventListener("error", function (e) {
    if (window.__engineReady || shown) return;      // 只處理「遊戲還沒準備好」時的第一個錯誤
    shown = true;
    const box = document.getElementById("map-errors");
    const btn = document.getElementById("btn-start");
    if (btn) btn.disabled = true;
    if (!box) return;
    const where = e.lineno ? `(這個檔案的第 ${e.lineno} 行附近)` : "";
    const li = document.createElement("li");
    li.className = "title";
    li.textContent = `程式有錯誤,遊戲無法開始${where}:${e.message || "未知的錯誤"}。`
      + "最常見的原因是漏了逗號、引號或括號沒有成對,請修正後重新整理。";
    box.innerHTML = "";
    box.appendChild(li);
    box.classList.remove("hidden");
  });
})();
</script>

/* 內建換色版本:不用畫新圖,就能讓每個角色長得不一樣(網址加 #sprites 可以預覽)
   - 動物:leafbunny_2、leafbunny_3、bubblefin_2 …(五種動物各兩種換色;輪廓、白色、灰色不變)
   - 村民:villager_green、villager_purple、villager_orange、villager_pink、villager_elder(玩家的圖換帽子、頭髮、衣服顏色),給人物 NPC 用 */
(function () {
  const hex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const toHex = (rgb) => "#" + rgb.map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
  function rotate(h, deg) {
    if (!/^#[0-9a-f]{6}$/i.test(h)) return h;
    const [r, g, b] = hex(h), max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (s < 0.2 || l < 0.2 || l > 0.93) return h;          // 輪廓、白色、灰色不換
    let hue = d === 0 ? 0 : max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    hue = ((hue * 60 + deg) % 360 + 360) % 360;
    const c = d, x = c * (1 - Math.abs((hue / 60) % 2 - 1)), m = l - c / 2;
    const [r1, g1, b1] = hue < 60 ? [c, x, 0] : hue < 120 ? [x, c, 0] : hue < 180 ? [0, c, x] : hue < 240 ? [0, x, c] : hue < 300 ? [x, 0, c] : [c, 0, x];
    return toHex([r1 + m, g1 + m, b1 + m]);
  }
  // 每種動物轉兩個角度,避開和草地撞色的綠色
  Object.entries({ leafbunny: [120, 240], bubblefin: [150, 50], emberchick: [180, 240], pebbleshell: [120, 240], starbug: [120, 240] }).forEach(([name, degs]) => {
    degs.forEach((deg, i) => { const n = i + 2;
      const def = SPRITES[name], palette = {};
      Object.keys(def.palette).forEach(k => { palette[k] = rotate(def.palette[k], deg); });
      SPRITES[`${name}_${n}`] = { palette, rows: def.rows };
    });
  });
  const villagers = {   // r/R 帽子、h 頭髮、b/B 衣服
    villager_green:  { r: "#48a048", R: "#2f7030", h: "#583020", b: "#e0c040", B: "#b09020" },
    villager_purple: { r: "#8858c8", R: "#603898", h: "#202020", b: "#e07090", B: "#b04868" },
    villager_orange: { r: "#f09030", R: "#b86018", h: "#a06030", b: "#50a0a0", B: "#307878" },
    villager_pink:   { r: "#f080b0", R: "#c05080", h: "#302018", b: "#60b060", B: "#408040" },
    villager_elder:  { r: "#a0a0a8", R: "#70707a", h: "#e0e0e0", b: "#8060a0", B: "#5a4078" }
  };
  Object.entries(villagers).forEach(([name, colors]) => {
    SPRITES[name] = { palette: Object.assign({}, SPRITES.player_down.palette, colors), rows: SPRITES.player_down.rows };
  });
})();

/* =========================================================
   第三部分:遊戲引擎 —— 通常不需要修改
   ========================================================= */

const TILE = 16;
// 視野大小:電腦和橫式螢幕是 15 × 10 格(240 × 160 像素,和 GBA 一樣);
// 直式手機自動改成 11 × 12 格,每格才放得夠大。由 fitView() 決定,不要直接改這兩個值
let VIEW_W = 15, VIEW_H = 10;
const WALK = { ".": 1, ",": 1, "*": 1, "=": 1, "+": 1 };
const BLOCK = { "T": "tree", "~": "water", "O": "rock", "#": "fence", "H": "house" };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

const el = (id) => document.getElementById(id);
const CREATURE_MARKS = "123456789!?$%&<>[]^:;|";      // 站在地圖上的角色(包含 NPC、告示牌、寶箱)可以用的字元
const isCreatureMark = (ch) => typeof ch === "string" && ch.length === 1 && CREATURE_MARKS.includes(ch);
const isLower = (ch) => ch >= "a" && ch <= "z";
const isGateChar = (ch) => /^[A-Z]$/.test(ch) && !BLOCK[ch];     // 大寫字母,但 T(樹)、O(石頭)、H(房子)已經是地形
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- 畫面上的文字 ----------
   預設文字在這裡,GAME.text 可以覆蓋其中任何一句。{name} 等會自動換成對應的內容 */

const fmt = (str, vars) => String(str).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m));
const say = (key, vars) => fmt(Object.assign({}, DEFAULT_TEXT, GAME.text || {})[key], vars);
const hasQuiz = (o) => !!(o.question !== undefined || o.questions);
const quizList = (o) => o.questions || (o.question !== undefined ? [o] : []);   // 一隻角色(或一扇門)的所有題目
const QUIZ = () => CREATURES.filter(hasQuiz);          // 帶問題、要收服的角色(不含純對話的 NPC)
/* 現在要出的題目:第一次出第 1 題,每答錯一次換下一題 */
function currentQ(o) { const list = quizList(o); return list[(state.qTurn[o.id] || 0) % list.length]; }

/* 遊戲狀態。需要新欄位時在這裡加,並在 resetState() 裡重置;不要改既有欄位名稱 */
let state = {
  grid: [], px: 0, py: 0, facing: "down", move: null, stepParity: 0, held: null,
  caughtCreatures: [], collectedItems: [], openedGates: [], usedItems: [], talked: [], attempts: {}, qTurn: {}, wrongCount: 0, grassSteps: 0,
  moveCount: 0, startTime: null, playerName: "", busy: false, running: false

/* ---------- 像素圖編譯 ---------- */
const GFX = {};  // 名稱 → canvas
function compileSprite(def, flip) {
  const c = document.createElement("canvas");
  c.width = TILE; c.height = TILE;
  const ctx = c.getContext("2d");
  def.rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === "." || !def.palette[ch]) continue;
      ctx.fillStyle = def.palette[ch];
      ctx.fillRect(flip ? TILE - 1 - x : x, y, 1, 1);
    }
  });
  return c;
}
function loadGraphics() {
  if (typeof CUSTOM_SPRITES === "object") Object.assign(SPRITES, CUSTOM_SPRITES);   // 內容包新畫的圖
  Object.entries(SPRITES).forEach(([name, def]) => {
    GFX[name] = compileSprite(def, false);
    GFX[name + ":flip"] = compileSprite(def, true);
  });
  Object.entries(TILES).forEach(([name, def]) => { GFX["tile:" + name] = compileSprite(def, false); });
  // 使用者上傳的圖(data URI)
  const jobs = CREATURES.concat(ITEMS).concat(GATES.map(g => ({ ...g, id: "gate:" + g.mark }))).filter(o => o.image).map(o => new Promise(res => {
    const img = new Image();
    img.onload = () => { GFX["img:" + (o.id || o.mark)] = img; res(); };
    img.onerror = res;
    img.src = o.image;
  }));
  return Promise.all(jobs);
}
/* 角色或道具要畫的圖(canvas 或 Image) */
function gfxOf(obj) {
  if (obj.image) return GFX["img:" + (obj.id || obj.mark)] || null;
  return GFX[obj.sprite] || null;
}
function drawObj(ctx, obj, x, y, size) {
  const g = gfxOf(obj);
  if (!g) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(g, x, y, size, size);
}

/* ---------- 地圖資料檢查 ----------
   開始畫面會自動執行;有錯誤時列在紅框裡並停用開始按鈕。
   改了地圖、角色、道具或圖片之後,一定要確認沒有紅框 */
function validateSprite(name, def, errors) {
  if (!def || !Array.isArray(def.rows) || !def.palette) { errors.push(`圖片「${name}」格式不對,要有 palette 和 rows`); return; }
  if (def.rows.length !== 16) errors.push(`圖片「${name}」有 ${def.rows.length} 行,要剛好 16 行`);
  def.rows.forEach((row, i) => {
    if (row.length !== 16) errors.push(`圖片「${name}」第 ${i + 1} 行有 ${row.length} 個字元,要剛好 16 個`);
    const bad = [...new Set(row.split("").filter(ch => ch !== "." && !def.palette[ch]))];
    if (bad.length) errors.push(`圖片「${name}」第 ${i + 1} 行用了 palette 沒定義的字元:${bad.join(" ")}`);
  });
}
function validateMap() {
  const errors = [];
  if (!MAP.length) return ["MAP 是空的"];
  const H = MAP.length, W = MAP[0].length;
  const pos = (x, y) => `第 ${y + 1} 列第 ${x + 1} 格`;
  MAP.forEach((row, y) => { if (row.length !== W) errors.push(`MAP 第 ${y + 1} 列有 ${row.length} 個字元,第 1 列有 ${W} 個,每一列要一樣長`); });

  let start = null, starts = 0;
  const marks = {};
  MAP.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "@") { starts++; start = [x, y]; return; }
    if (WALK[ch] || BLOCK[ch]) return;
    if (isCreatureMark(ch) || isLower(ch) || isGateChar(ch)) { (marks[ch] = marks[ch] || []).push([x, y]); return; }
    errors.push(`${pos(x, y)}的字元「${ch}」不是地圖代碼`);
  }));
  if (starts !== 1) errors.push(`地圖上要剛好有一個起點 @,目前有 ${starts} 個`);

  const checkQuestion = (who, owner) => {
    if (owner.questions !== undefined && (!Array.isArray(owner.questions) || !owner.questions.length)) { errors.push(`${who}的 questions 要是至少有一題的陣列`); return; }
    quizList(owner).forEach((o, i) => {
      const w = owner.questions ? `${who}第 ${i + 1} 題` : who;
      if (typeof o.question !== "string" || !o.question.trim()) errors.push(`${w}的 question 要是文字`);
      if (!Array.isArray(o.choices) || o.choices.length < 2) { errors.push(`${w}至少要有 2 個選項`); return; }
      if (!(Number.isInteger(o.answerIndex) && o.answerIndex >= 0 && o.answerIndex < o.choices.length)) { errors.push(`${w}的 answerIndex (${o.answerIndex}) 不是有效的選項位置`); return; }
      Object.keys(o.mistakes || {}).forEach(k => {
        if (!o.choices.includes(k)) errors.push(`${w}的 mistakes「${k}」不是任何一個選項的文字(要和 choices 裡的字一模一樣)`);
        else if (k === o.choices[o.answerIndex]) errors.push(`${w}的 mistakes 把正確答案「${k}」寫成了錯誤`);
      });
    });
  };
  const floorOk = (who, o) => { if (o.floor !== undefined && !WALK[o.floor]) errors.push(`${who}的 floor「${o.floor}」要是走得過去的地形(. , * = +)`); };
  const hasText = (v) => (typeof v === "string" && v.trim() !== "") || (Array.isArray(v) && v.length > 0 && v.every(x => typeof x === "string"));
  const itemMarks = new Set(ITEMS.map(i => i.mark));
  const givenItems = new Set(CREATURES.filter(c => c.gives).map(c => c.gives));

  const ids = new Set();
  CREATURES.forEach(cr => {
    const who = `角色「${cr.name}」`;
    if (ids.has(cr.id)) errors.push(`角色 id「${cr.id}」重複了`);
    ids.add(cr.id);
    if (cr.where !== "map" && cr.where !== "grass") errors.push(`${who}的 where 要填 "map" 或 "grass"`);
    if (cr.where === "map") {
      if (!isCreatureMark(String(cr.mark))) errors.push(`地圖角色「${cr.name}」的 mark「${cr.mark}」不能用,要填 1~9 或 ${CREATURE_MARKS.slice(9).split("").join(" ")} 其中一個(小寫字母是道具)`);
      const n = (marks[cr.mark] || []).length;
      if (n === 0) errors.push(`地圖角色「${cr.name}」(mark ${cr.mark})沒有放在 MAP 上,這樣永遠無法過關`);
      if (n > 1) errors.push(`mark ${cr.mark} 在 MAP 上出現了 ${n} 次,每隻角色只能放一格`);
    }
    floorOk(who, cr);
    if (hasQuiz(cr)) checkQuestion(who, cr);
    else {
      if (cr.where === "grass") errors.push(`草叢角色「${cr.name}」一定要有問題(question、choices、answerIndex)`);
      if (!hasText(cr.dialogue)) errors.push(`${who}沒有問題的話,要有 dialogue(對話文字,或文字陣列)`);
    }
    if (cr.stays && cr.where !== "map") errors.push(`${who}:stays 只能用在 where: "map" 的角色`);
    if (cr.gives !== undefined && !itemMarks.has(cr.gives)) errors.push(`${who}的 gives「${cr.gives}」不在 ITEMS 裡`);
  });

  ITEMS.forEach(it => {
    if (!isLower(String(it.mark))) errors.push(`道具「${it.name}」的 mark 要填小寫英文字母`);
    const n = (marks[it.mark] || []).length;
    if (n === 0 && !givenItems.has(it.mark)) errors.push(`道具「${it.name}」(mark ${it.mark})沒有放在 MAP 上,也沒有任何角色把它當作 gives 送出${GAME.requireAllItems ? ",這樣永遠無法過關" : ""}`);
    if (n > 1) errors.push(`mark ${it.mark} 在 MAP 上出現了 ${n} 次,每個道具只能放一格`);
  });

  const gateMarks = new Set();
  GATES.forEach(g => {
    const who = `門「${g.name || g.mark}」`;
    if (!isGateChar(String(g.mark))) errors.push(`${who}的 mark 要填大寫英文字母(T、O 不能用)`);
    if (gateMarks.has(g.mark)) errors.push(`門的 mark「${g.mark}」重複了`);
    gateMarks.add(g.mark);
    if (typeof g.name !== "string" || !g.name.trim()) errors.push(`mark 是 ${g.mark} 的門要有 name`);
    if ((marks[g.mark] || []).length === 0) errors.push(`${who}(mark ${g.mark})沒有放在 MAP 上`);
    [].concat(g.needs || []).forEach(m => { if (!itemMarks.has(m)) errors.push(`${who}的 needs「${m}」不在 ITEMS 裡`); });
    if (hasQuiz(g)) checkQuestion(who, g);
    floorOk(who, g);
    if (g.needsAllCreatures && !QUIZ().length) errors.push(`${who}設了 needsAllCreatures,但沒有任何帶題目的角色`);
  });
  const consumed = {};
  GATES.filter(g => g.consume).forEach(g => [].concat(g.needs || []).forEach(m => { consumed[m] = (consumed[m] || 0) + 1; }));
  Object.entries(consumed).forEach(([m, n]) => { if (n > 1) errors.push(`道具「${itemName(m)}」會被 ${n} 扇設了 consume 的門用掉,但它只有一個`); });
  // 會被用掉的道具如果還有別扇門需要:玩家先開了會用掉它的那扇,另一扇就永遠打不開(卡死)
  Object.keys(consumed).forEach(m => {
    const others = GATES.filter(g => !g.consume && [].concat(g.needs || []).includes(m));
    if (others.length) errors.push(`道具「${itemName(m)}」開門時會被用掉,但「${others.map(g => g.name).join("、")}」也需要它:玩家先開了會用掉它的門,這扇就永遠打不開。拿掉 consume,或給這扇門另一個道具`);
  });

  Object.keys(marks).forEach(m => {
    const known = isCreatureMark(m) ? CREATURES.some(c => c.where === "map" && String(c.mark) === m) : isGateChar(m) ? gateMarks.has(m) : ITEMS.some(i => i.mark === m);
    if (!known) errors.push(`MAP 上的「${m}」(${pos(...marks[m][0])})在 ${isCreatureMark(m) ? "CREATURES" : isGateChar(m) ? "GATES" : "ITEMS"} 裡找不到` +
      (isLower(m) && CREATURES.some(c => c.mark === m) ? "。小寫字母只能放道具,角色、NPC、告示牌、寶箱的 mark 請改用 1~9 或符號" : ""));
  });

  // 圖片
  CREATURES.concat(ITEMS).concat(GATES).forEach(o => {
    if (o.image) {
      if (!String(o.image).startsWith("data:image/")) errors.push(`「${o.name}」的 image 要用 data URI(data:image/...),不能填網址`);
    } else {
      const sp = o.sprite || (GATES.includes(o) ? "door" : undefined);
      if (!SPRITES[sp]) errors.push(`「${o.name}」的 sprite「${sp}」在 SPRITES 裡找不到`);
    }
  });
  Object.entries(SPRITES).forEach(([n, d]) => validateSprite(n, d, errors));

  // 過關條件一開始就成立 = 玩家一動就過關(常見原因:沒有任何帶問題的角色,也沒有道具)
  try {
    const keep = { c: state.caughtCreatures, i: state.collectedItems, g: state.openedGates, u: state.usedItems, t: state.talked };
    state.caughtCreatures = []; state.collectedItems = []; state.openedGates = []; state.usedItems = []; state.talked = [];
    const instantWin = isWin();
    Object.assign(state, { caughtCreatures: keep.c, collectedItems: keep.i, openedGates: keep.g, usedItems: keep.u, talked: keep.t });
    if (instantWin) errors.push("過關條件在遊戲一開始就成立了(是不是沒有任何帶問題的角色、也沒有道具?)。至少放一隻帶問題的角色或一個道具,或自己改寫 isWin()");
  } catch (e) { errors.push("isWin() 執行出錯:" + e.message); }

  // 從起點走得到每一隻地圖角色、每一個道具、每一扇門;有草叢角色時要走得到高草叢。
  // 門要一輪一輪模擬:拿得到需要的道具(包含角色送的),門才算能打開,打開後後面的區域才算走得到
  if (!errors.length) {
    // cleared:答對之後會消失的地圖角色(有題目、沒設 stays)。碰得到牠,牠那一格之後就能通過,
    // 所以「角色擋在路上,答對才讓路」的地圖是可以過關的;NPC 和 stays 的角色永遠擋路
    const open = new Set(), got = new Set(), cleared = new Set(), catchable = new Set();
    const allCaught = () => QUIZ().every(c => catchable.has(c.id));
    let seen = null;
    const walkable = (ch) => WALK[ch] || ch === "@" || isLower(ch) || (isGateChar(ch) && open.has(ch)) || (isCreatureMark(ch) && cleared.has(ch));
    const flood = () => {
      const sn = MAP.map(r => [...r].map(() => false));
      const q = [start]; sn[start[1]][start[0]] = true;
      while (q.length) {
        const [x, y] = q.shift();
        Object.values(DIRS).forEach(([dx, dy]) => {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H || sn[ny][nx] || !walkable(MAP[ny][nx])) return;
          sn[ny][nx] = true; q.push([nx, ny]);
        });
      }
      return sn;
    };
    const touch = (x, y) => Object.values(DIRS).some(([dx, dy]) => seen[y + dy] && seen[y + dy][x + dx]);
    const grassReach = () => MAP.some((row, y) => [...row].some((ch, x) => ch === "," && seen[y][x]));
    const creatureReach = (cr) => cr.where === "grass" ? grassReach() : (marks[cr.mark] || []).some(([x, y]) => touch(x, y));
    for (let round = 0; round < 60; round++) {
      seen = flood();
      let changed = false;
      ITEMS.forEach(it => {
        const at = marks[it.mark];
        if (!got.has(it.mark) && at && seen[at[0][1]][at[0][0]]) { got.add(it.mark); changed = true; }
      });
      CREATURES.forEach(cr => { if (cr.gives && !got.has(cr.gives) && creatureReach(cr)) { got.add(cr.gives); changed = true; } });
      CREATURES.forEach(cr => {
        const m = String(cr.mark);
        if (cr.where === "map" && hasQuiz(cr) && !cr.stays && !cleared.has(m) && creatureReach(cr)) { cleared.add(m); changed = true; }
        if (hasQuiz(cr) && !catchable.has(cr.id) && creatureReach(cr)) { catchable.add(cr.id); changed = true; }
      });
      GATES.forEach(g => {
        if (open.has(g.mark)) return;
        if ((marks[g.mark] || []).some(([x, y]) => touch(x, y)) && [].concat(g.needs || []).every(m => got.has(m)) && (!g.needsAllCreatures || allCaught())) { open.add(g.mark); changed = true; }
      });
      if (!changed) break;
    }
    GATES.forEach(g => {
      if (open.has(g.mark)) return;
      const [x, y] = marks[g.mark][0];
      const missing = [].concat(g.needs || []).filter(m => !got.has(m)).map(itemName);
      if (!touch(x, y)) errors.push(`門「${g.name}」在 ${pos(x, y)},旁邊沒有走得到的格子(可能被別的門擋住),永遠打不開`);
      else if (missing.length) errors.push(`門「${g.name}」永遠打不開:需要的道具「${missing.join("、")}」拿不到(可能放在這扇門後面)`);
      else if (g.needsAllCreatures) errors.push(`門「${g.name}」要收服全部角色才打得開,但有角色走不到(可能在這扇門後面)`);
    });
    CREATURES.filter(c => c.where === "map").forEach(cr => {
      const [x, y] = marks[cr.mark][0];
      if (!touch(x, y)) errors.push(`地圖角色「${cr.name}」在 ${pos(x, y)},旁邊沒有走得到的格子,這樣永遠無法過關`);
    });
    ITEMS.forEach(it => {
      const at = marks[it.mark];
      if (at && !seen[at[0][1]][at[0][0]]) errors.push(`道具「${it.name}」在 ${pos(at[0][0], at[0][1])},被擋住走不到${GAME.requireAllItems ? ",這樣永遠無法過關" : ""}`);
      if (!at && !got.has(it.mark)) errors.push(`道具「${it.name}」只由角色送出,但送它的角色走不到(或不會被收服)`);
    });
    if (CREATURES.some(c => c.where === "grass") && !grassReach()) errors.push(`有草叢角色,但地圖上沒有走得到的高草叢「,」,這樣永遠無法過關`);
  }
  return errors;
}
function showMapErrors() {
  const errors = validateMap();
  const box = el("map-errors");
  box.innerHTML = errors.length ? `<li class="title">遊戲資料有問題,修正後才能開始:</li>` + errors.map(e => `<li>${escapeHtml(e)}</li>`).join("") : "";
  box.classList.toggle("hidden", !errors.length);
  el("btn-start").disabled = errors.length > 0;
  return errors;
}

/* ---------- 地圖查詢 ---------- */
const mapW = () => state.grid[0].length;
const mapH = () => state.grid.length;
const cell = (x, y) => (y >= 0 && y < mapH() && x >= 0 && x < mapW()) ? state.grid[y][x] : "T";
/* 角色、門那一格底下要畫的地形(floor,預設草地) */
function floorOf(ch) {
  if (WALK[ch] || BLOCK[ch]) return ch;
  const o = isCreatureMark(ch) ? CREATURES.find(c => c.where === "map" && String(c.mark) === ch) : isGateChar(ch) ? GATES.find(g => g.mark === ch) : null;
  return (o && o.floor) || ".";
}
function creatureAt(x, y) {
  const ch = cell(x, y);
  if (!isCreatureMark(ch)) return null;
  return CREATURES.find(c => c.where === "map" && String(c.mark) === ch && (!state.caughtCreatures.includes(c.id) || c.stays)) || null;
}

/* ---------- 門與道具 ---------- */
const itemName = (mark) => (ITEMS.find(i => i.mark === mark) || { name: mark }).name;
const hasItem = (mark) => state.collectedItems.includes(mark) && !state.usedItems.includes(mark);
function gateAt(x, y) {
  const ch = cell(x, y);
  return isGateChar(ch) ? (GATES.find(g => g.mark === ch) || null) : null;
}
/* 門在畫面和問答裡用的物件(有自己的 id、圖) */
const gateObj = (g) => ({ ...g, id: "gate:" + g.mark, kind: "gate", gate: g, sprite: g.sprite || "door" });
function giveItem(mark) {
  if (!state.collectedItems.includes(mark)) state.collectedItems.push(mark);
  toast(say("itemGot", { name: itemName(mark) }));
  renderHud();
}
function openGate(g, quiet) {
  state.grid.forEach((row, y) => row.forEach((ch, x) => { if (ch === g.mark) state.grid[y][x] = g.floor || "."; }));
  if (!state.openedGates.includes(g.mark)) state.openedGates.push(g.mark);
  if (g.consume) [].concat(g.needs || []).forEach(m => { if (!state.usedItems.includes(m)) state.usedItems.push(m); });
  if (!quiet) { toast(g.openedText || say("gateOpened", { name: g.name })); checkWinCondition(); }
}
/* 這扇門還缺什麼:{ items: [道具 mark], creatures: [還沒收服的角色] } */
function gateMissing(g) {
  return { items: [].concat(g.needs || []).filter(m => !hasItem(m)),
           creatures: g.needsAllCreatures ? QUIZ().filter(c => !state.caughtCreatures.includes(c.id)) : [] };
}
function touchGate(g) {
  if (state.busy) return;
  const miss = gateMissing(g);
  if (miss.items.length) { toast(g.lockedText || say("gateLocked", { name: g.name, need: miss.items.map(itemName).join("、") })); return; }
  if (miss.creatures.length) {     // 終點:列出還差誰、在哪裡
    openPanel(`<p class="q">${escapeHtml(g.lockedText || say("gateNeedAll", { name: g.name, n: miss.creatures.length }))}</p><ul class="bag-list">` +
      miss.creatures.map(c => `<li>${escapeHtml(c.name + (c.area ? "——" + c.area : ""))}</li>`).join("") + `</ul>`);
    return;
  }
  if (hasQuiz(g)) { startEncounter(gateObj(g), "gate"); return; }
  openGate(g);
}
function canWalk(x, y) {
  const ch = cell(x, y);
  return !!(WALK[ch] || isLower(ch));
}
const remainingGrass = () => CREATURES.filter(c => c.where === "grass" && !state.caughtCreatures.includes(c.id));

/* ---------- 繪圖 ---------- */
const view = el("view"), vctx = view.getContext("2d");
let clock = 0;
function grassVariant(x, y) { return "grass" + ((x * 7 + y * 13 + ((x * y) % 5)) % 3); }
function drawTile(ctx, x, y, sx, sy) {
  const ch = floorOf(cell(x, y));
  if (ch === "H") { ctx.drawImage(GFX["tile:" + (cell(x, y - 1) === "H" ? "wall" : "roof")], sx, sy); return; }
  if (ch === "~") {
    ctx.drawImage(GFX["tile:water" + (Math.floor(clock / 600) % 2)], sx, sy);
    // 岸邊:旁邊不是水的那一側畫淺色水花
    ctx.fillStyle = "#c8e4ff";
    if (cell(x, y - 1) !== "~") ctx.fillRect(sx, sy, TILE, 2);
    if (cell(x, y + 1) !== "~") ctx.fillRect(sx, sy + TILE - 2, TILE, 2);
    if (cell(x - 1, y) !== "~") ctx.fillRect(sx, sy, 2, TILE);
    if (cell(x + 1, y) !== "~") ctx.fillRect(sx + TILE - 2, sy, 2, TILE);
    return;
  }
  const base = ch === "," ? "tallgrass" : ch === "=" ? "path" : ch === "*" ? "flowers" : ch === "+" ? "bridge" : grassVariant(x, y);
  ctx.drawImage(GFX["tile:" + base], sx, sy);
  if (BLOCK[ch] && BLOCK[ch] !== "water") ctx.drawImage(GFX["tile:" + BLOCK[ch]], sx, sy);
}
function playerFrame() {
  const walking = state.move && state.move.t < 0.6;
  const flip = state.stepParity === 1;
  switch (state.facing) {
    case "up": return walking ? GFX["player_up_walk" + (flip ? ":flip" : "")] : GFX["player_up"];
    case "left": return walking ? GFX["player_side_walk:flip"] : GFX["player_side:flip"];
    case "right": return walking ? GFX["player_side_walk"] : GFX["player_side"];
    default: return walking ? GFX["player_down_walk" + (flip ? ":flip" : "")] : GFX["player_down"];
  }
}
function playerPixel() {
  if (!state.move) return [state.px * TILE, state.py * TILE];
  const m = state.move, t = Math.min(1, m.t);
  return [(m.fx + (m.tx - m.fx) * t) * TILE, (m.fy + (m.ty - m.fy) * t) * TILE];
}
function draw() {
  const [ppx, ppy] = playerPixel();
  const W = mapW() * TILE, H = mapH() * TILE;
  const vw = VIEW_W * TILE, vh = VIEW_H * TILE;
  let camX = Math.round(ppx + TILE / 2 - vw / 2), camY = Math.round(ppy + TILE / 2 - vh / 2);
  camX = W <= vw ? Math.round((W - vw) / 2) : Math.max(0, Math.min(W - vw, camX));
  camY = H <= vh ? Math.round((H - vh) / 2) : Math.max(0, Math.min(H - vh, camY));

  vctx.fillStyle = "#000"; vctx.fillRect(0, 0, vw, vh);
  const x0 = Math.floor(camX / TILE), y0 = Math.floor(camY / TILE);
  for (let y = y0; y <= y0 + VIEW_H; y++) {
    for (let x = x0; x <= x0 + VIEW_W; x++) {
      if (x < 0 || y < 0 || x >= mapW() || y >= mapH()) continue;
      const sx = x * TILE - camX, sy = y * TILE - camY;
      drawTile(vctx, x, y, sx, sy);
      const ch = cell(x, y);
      if (isLower(ch)) { const it = ITEMS.find(i => i.mark === ch); if (it) drawObj(vctx, it, sx, sy, TILE); }
      const gt = gateAt(x, y);
      if (gt) drawObj(vctx, gateObj(gt), sx, sy, TILE);
      const cr = creatureAt(x, y);
      if (cr) drawObj(vctx, cr, sx, sy - (Math.floor(clock / 450 + x) % 2), TILE);
    }
  }
  const px = Math.round(ppx - camX), py = Math.round(ppy - camY);
  vctx.drawImage(playerFrame(), px, py - 2);
  // 站在高草叢裡時,草蓋住下半身
  const tx = Math.round(ppx / TILE), ty = Math.round(ppy / TILE);
  if (cell(tx, ty) === ",") vctx.drawImage(GFX["tile:tallgrass"], 0, 10, TILE, 6, tx * TILE - camX, ty * TILE - camY + 10, TILE, 6);
}
function renderHud() {
  const total = QUIZ().length;
  el("hud-creatures").textContent = say("hudCreatures", { n: state.caughtCreatures.length, total });
  el("hud-creatures").classList.toggle("hidden", total === 0);
  el("hud-items").textContent = say("hudItems", { n: state.collectedItems.length, total: ITEMS.length });
  el("hud-items").classList.toggle("hidden", ITEMS.length === 0);
}
let toastTimer = null;
function toast(text) {
  const t = el("toast");
  t.textContent = text; t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), Math.max(1600, String(text).length * 110));   // 長的句子停久一點
}

/* ---------- 移動 ---------- */
function tryStep(dir) {
  state.facing = dir;
  const [dx, dy] = DIRS[dir];
  const nx = state.px + dx, ny = state.py + dy;
  const cr = creatureAt(nx, ny);
  if (cr) { state.held = null; startEncounter(cr, "map"); return; }
  const gt = gateAt(nx, ny);
  if (gt) { state.held = null; touchGate(gt); return; }
  if (!canWalk(nx, ny)) return;          // 撞到牆只轉方向
  state.move = { fx: state.px, fy: state.py, tx: nx, ty: ny, t: 0 };
  state.stepParity ^= 1;
  state.moveCount++;
}
function onArrive() {
  const ch = cell(state.px, state.py);
  if (isLower(ch)) {
    const it = ITEMS.find(i => i.mark === ch);
    if (it && !state.collectedItems.includes(it.mark)) {
      state.grid[state.py][state.px] = ".";
      giveItem(it.mark);
      if (checkWinCondition()) return;
    }
  }
  if (ch === "," && remainingGrass().length) {
    state.grassSteps++;
    if (Math.random() < GAME.grassEncounterRate || state.grassSteps >= GAME.grassPity) {
      state.grassSteps = 0;
      const pool = remainingGrass();
      state.held = null;
      startEncounter(pool[Math.floor(Math.random() * pool.length)], "grass");
    }
  }
}
function interact() {
  const [dx, dy] = DIRS[state.facing];
  const cr = creatureAt(state.px + dx, state.py + dy);
  if (cr) { startEncounter(cr, "map"); return; }
  const gt = gateAt(state.px + dx, state.py + dy);
  if (gt) touchGate(gt);
}
let last = 0;
function loop(ts) {
  if (!state.running) return;
  const dt = last ? Math.min(50, ts - last) : 16;
  last = ts; clock += dt;
  if (state.move) {
    state.move.t += dt / GAME.moveMs;
    if (state.move.t >= 1) {
      state.px = state.move.tx; state.py = state.move.ty; state.move = null;
      onArrive();
    }
  }
  // 過關的那一刻 state.running 已經是 false;不擋的話,按著方向鍵會再多走一格,步數多算一步
  if (state.running && !state.move && !state.busy && state.held) tryStep(state.held);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- 遇到角色 ----------
   state.busy 為 true 時,移動整個鎖住;不要拿掉這個鎖定 */
const enc = { creature: null, source: null, phase: null, sel: 0, order: [], anim: 0, pending: null };
function drawEncounterScene() {
  const c = el("enc-scene"), ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const grass = enc.source === "grass";
  // 畫布大小跟著視野(電腦 240 × 160、直式手機 176 × 192),位置都用比例算
  const W = c.width, H = c.height;
  // 背景:天空與地面色帶
  const bands = grass ? ["#b8e8f8", "#a0d8f0", "#88c8e8"] : ["#d8f0c8", "#c0e4b0", "#a8d898"];
  const bandH = Math.round(H * 0.34 / 3);
  bands.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(0, i * bandH, W, bandH); });
  const groundY = bandH * 3;
  ctx.fillStyle = grass ? "#70c050" : "#88c860"; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = grass ? "#58a840" : "#70b050";
  for (let x = 0; x < W; x += 8) ctx.fillRect(x + ((x / 8) % 2) * 3, groundY + 6 + ((x * 7) % 9), 3, 2);
  // 角色站的平台
  const slide = Math.max(0, 1 - enc.anim);
  const cx = Math.round(W * 0.7) + slide * W * 0.4;
  const py = Math.round(H * 0.49);
  ctx.fillStyle = grass ? "#4c9838" : "#5ea848";
  ctx.beginPath(); ctx.ellipse(cx, py, 40, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = grass ? "#62b04a" : "#78c060";
  ctx.beginPath(); ctx.ellipse(cx, py - 2, 36, 8, 0, 0, Math.PI * 2); ctx.fill();
  drawObj(ctx, enc.creature, Math.round(cx - 32), py - 64, 64);
}
function animateEncounter() {
  enc.anim = 0;
  const t0 = performance.now();
  const step = () => {
    // 用 performance.now() 而不是 requestAnimationFrame 給的時間:headless 截圖時兩個時鐘對不上,角色會一直停在畫面外
    if (enc.anim >= 1) return;
    enc.anim = Math.min(1, (performance.now() - t0) / 380);
    drawEncounterScene();
    if (enc.anim < 1 && enc.phase) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  // 背景分頁或 headless 截圖時 requestAnimationFrame 可能不跑,角色會停在畫面外;時間到了直接畫最後一格
  setTimeout(() => { if (enc.phase && enc.creature && enc.anim < 1) { enc.anim = 1; drawEncounterScene(); } }, 500);
}
/* 只會說話:沒有問題的 NPC,或是答對後仍站在地圖上(stays)的角色 */
function talkLines(cr, done) {
  const raw = done && !cr.dialogue ? say("talkDone", { name: cr.name }) : cr.dialogue;
  const lines = [].concat(raw);
  lines[0] = (done && !cr.dialogue ? "" : cr.name + ":") + lines[0];
  return lines.map(l => `<p class="q" style="margin:0 0 6px">${escapeHtml(l)}</p>`).join("");
}
function startEncounter(creature, source) {
  if (state.busy) return;
  state.busy = true; state.held = null; clearPadHighlight();
  const done = state.caughtCreatures.includes(creature.id);
  const talk = source !== "gate" && (!hasQuiz(creature) || (creature.stays && done));
  Object.assign(enc, { creature, source, phase: talk ? "talk" : "intro", sel: 0, pending: null });
  el("encounter").classList.remove("hidden");
  el("enc-box").classList.remove("hidden");
  document.querySelector(".hud").classList.add("hidden");
  animateEncounter();
  if (talk) {
    el("enc-box").innerHTML = talkLines(creature, done) + `<div class="enc-more">${escapeHtml(say("more"))}</div>`;
    // 純對話的 NPC:第一次講完話才送道具(有問題的角色在答對時就已經送了)
    if (!hasQuiz(creature) && !state.talked.includes(creature.id)) {
      state.talked.push(creature.id);
      if (creature.gives && !state.collectedItems.includes(creature.gives)) enc.pending = creature.gives;
    }
    return;
  }
  const line = say(source === "grass" ? "foundGrass" : source === "gate" ? "foundGate" : "foundMap", { name: creature.name });
  const greet = creature.greet ? `<p class="q">${escapeHtml(creature.name + ":" + creature.greet)}</p>` : "";
  el("enc-box").innerHTML = `<p class="q">${escapeHtml(line)}</p>${greet}<div class="enc-more">${escapeHtml(say("more"))}</div>`;
}
/* 不是遇到角色的對話框(背包、還差誰的清單):沿用問答框,按確定關掉 */
function openPanel(html) {
  if (state.busy || !state.running) return;
  state.busy = true; state.held = null; clearPadHighlight();
  Object.assign(enc, { creature: null, source: "panel", phase: "talk", sel: 0, pending: null });
  el("enc-box").innerHTML = html + `<div class="enc-more">${escapeHtml(say("more"))}</div>`;
  el("enc-box").classList.remove("hidden");
  el("enc-box").scrollTop = 0;
}
function openBag() {
  const list = ITEMS.filter(i => state.collectedItems.includes(i.mark));
  const used = (i) => state.usedItems.includes(i.mark);
  openPanel(`<p class="q">${escapeHtml(say("bagTitle"))}</p>` + (list.length
    ? `<ul class="bag-list">` + list.map(i => `<li class="${used(i) ? "used" : ""}">${escapeHtml(i.name)}${used(i) ? escapeHtml(say("usedTag")) : ""}${i.note ? `<span class="note">${escapeHtml(i.note)}</span>` : ""}</li>`).join("") + `</ul>`
    : `<p class="q">${escapeHtml(say("bagEmpty"))}</p>`));
}
function showQuestion() {
  enc.phase = "question";
  const q = enc.q = currentQ(enc.creature);
  const order = q.choices.map((_, i) => i);
  enc.order = GAME.shuffleChoices ? shuffle(order) : order;   // 存原本的索引,answerIndex 不用改
  enc.sel = 0;
  el("enc-box").innerHTML = `<p class="q">${escapeHtml(q.question)}</p><ul class="choices">` +
    enc.order.map((ci, k) => `<li><button type="button" data-k="${k}">${escapeHtml(q.choices[ci])}</button></li>`).join("") + `</ul>`;
  el("enc-box").querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", (e) => { e.stopPropagation(); answer(+b.dataset.k); }));
  highlightChoice();
}
function highlightChoice() {
  el("enc-box").querySelectorAll("[data-k]").forEach((b, k) => b.classList.toggle("sel", k === enc.sel));
}
function answer(k) {
  if (enc.phase !== "question") return;
  enc.phase = "result";
  const cr = enc.creature, q = enc.q;
  const isGate = enc.source === "gate";
  const chosen = enc.order[k];
  state.attempts[cr.id] = (state.attempts[cr.id] || 0) + 1;
  const box = el("enc-box");
  const buttons = box.querySelectorAll("[data-k]");
  // 只留下選的那個:回饋才不會被擠出框外,答錯時也不會洩漏正確答案
  buttons.forEach((b, i) => { b.disabled = true; if (i !== k) b.parentElement.classList.add("hidden"); });
  let msg, fb = "";
  if (chosen === q.answerIndex) {
    buttons[k].classList.add("correct");
    if (isGate) {
      openGate(cr.gate, true);
      msg = cr.gate.openedText || say("gateOpened", { name: cr.name });
    } else {
      state.caughtCreatures.push(cr.id);
      if (cr.where === "map" && !cr.stays) {
        state.grid.forEach((row, y) => row.forEach((ch, x) => { if (ch === String(cr.mark)) state.grid[y][x] = cr.floor || "."; }));
      }
      if (cr.gives && !state.collectedItems.includes(cr.gives)) enc.pending = cr.gives;
      msg = cr.success || say("caught", { name: cr.name });
    }
    if (q.explanation) fb = `<p class="fb good">📖 ${escapeHtml(q.explanation)}</p>`;
  } else {
    buttons[k].classList.add("wrong");
    state.wrongCount++;
    state.qTurn[cr.id] = (state.qTurn[cr.id] || 0) + 1;      // 有好幾題時,下次換下一題
    msg = isGate ? say("gateWrong", { name: cr.name }) : say(cr.where === "map" ? "missMap" : "missGrass", { name: cr.name });
    const tip = (q.mistakes && q.mistakes[q.choices[chosen]]) || q.hint;   // 常見錯誤:指出選這個選項背後的迷思
    if (tip) fb = `<p class="fb">💡 ${escapeHtml(tip)}</p>`;
  }
  box.insertAdjacentHTML("beforeend", `<p class="q" style="margin:8px 0 0">${escapeHtml(msg)}</p>${fb}<div class="enc-more">${escapeHtml(say("more"))}</div>`);
  box.scrollTop = box.scrollHeight;
  renderHud();
}
function closeEncounter() {
  enc.phase = null;
  el("encounter").classList.add("hidden");
  el("enc-box").classList.add("hidden");
  document.querySelector(".hud").classList.remove("hidden");
  state.busy = false;
  if (enc.pending) { const p = enc.pending; enc.pending = null; giveItem(p); }
  checkWinCondition();
}
function encounterConfirm() {
  if (enc.phase === "intro") showQuestion();
  else if (enc.phase === "question") answer(enc.sel);
  else if (enc.phase === "result" || enc.phase === "talk") closeEncounter();
}

/* ---------- 過關與結算 ---------- */
function checkWinCondition() {
  if (state.running && isWin()) {
    state.running = false;
    setTimeout(finishGame, 300);
    return true;
  }
  return false;
}

function drawLineup(canvasId, silhouette) {
  const c = el(canvasId), ctx = c.getContext("2d");
  const list = QUIZ();
  c.classList.toggle("hidden", list.length === 0);
  if (!list.length) return;
  const n = list.length, gap = 4, size = 24;
  c.width = Math.max(240, n * (size + gap)); c.height = size + 4;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, c.width, c.height);
  const x0 = Math.round((c.width - n * (size + gap) + gap) / 2);
  list.forEach((cr, i) => {
    const x = x0 + i * (size + gap);
    if (!silhouette) { drawObj(ctx, cr, x, 2, size); return; }
    const tmp = document.createElement("canvas"); tmp.width = size; tmp.height = size;
    const t = tmp.getContext("2d"); t.imageSmoothingEnabled = false;
    drawObj(t, cr, 0, 0, size);
    t.globalCompositeOperation = "source-in"; t.fillStyle = "#0c0e1c"; t.fillRect(0, 0, size, size);
    ctx.drawImage(tmp, x, 2);
  });
}
function finishGame() {
  const durationSec = Math.round((Date.now() - state.startTime) / 1000);
  el("screen-game").classList.add("hidden");
  el("screen-end").classList.remove("hidden");
  drawLineup("end-lineup", false);
  const quiz = QUIZ();
  const firstTry = quiz.filter(c => state.attempts[c.id] === 1).length;
  el("end-title").textContent = say("endTitle");
  const ending = [].concat(GAME.ending || []).join("\n\n");
  el("end-story").textContent = ending;
  el("end-story").classList.toggle("hidden", !ending);
  el("lbl-creatures").textContent = say("labelCreatures");
  el("lbl-firsttry").textContent = say("labelFirstTry");
  el("lbl-items").textContent = say("labelItems");
  ["row-creatures", "row-firsttry"].forEach(id => el(id).classList.toggle("hidden", quiz.length === 0));
  el("row-items").classList.toggle("hidden", ITEMS.length === 0);
  el("sum-name").textContent = state.playerName;
  el("sum-creatures").textContent = `${state.caughtCreatures.length} / ${quiz.length}`;
  el("sum-firsttry").textContent = `${firstTry} / ${quiz.length}`;
  el("sum-wrong").textContent = state.wrongCount;
  el("sum-items").textContent = `${state.collectedItems.length} / ${ITEMS.length}`;
  el("sum-moves").textContent = state.moveCount;
  el("sum-time").textContent = durationSec + " 秒";
  saveBestIfNeeded(state.moveCount);

  /* 上傳的欄位由使用者決定;加欄位時 gas-backend.gs 的 HEADERS 和 rowFor() 也要對應 */
  const payload = {
    playerName: state.playerName,
    creaturesCaught: state.caughtCreatures.length,
    firstTryCount: firstTry,
    wrongCount: state.wrongCount,
    itemsCollected: state.collectedItems.length,
    moveCount: state.moveCount,
    durationSec: durationSec
  };
  sendResultsToSheet(payload);
}
function sendResultsToSheet(payload) {
  const statusEl = el("submit-status");
  if (!GAS_URL || GAS_URL.indexOf("PASTE_YOUR") === 0) {
    statusEl.textContent = "(尚未設定 Google 試算表網址,成績只顯示在畫面上)";
    return;
  }
  statusEl.textContent = "成績上傳中...";
  // no-cors 模式下瀏覽器只允許 text/plain 這類簡單的 Content-Type;後端一樣用 JSON.parse 讀內容。
  // keepalive:玩家一看到結算就關分頁,這筆成績也還是會送出去
  fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, keepalive: true, body: JSON.stringify(payload) })
    .then(() => { statusEl.textContent = "成績已送出 ✅"; })
    .catch(() => { statusEl.textContent = "送出失敗,請檢查網路連線"; });
}
/* 地圖簽章:最佳紀錄是「這張地圖、這組角色」下的步數。
   學員改了地圖或角色之後簽章會變,舊紀錄就不算數,避免開始畫面掛著打不到(或太容易打到)的舊步數 */
function bestSignature() {
  const raw = MAP.join("/") + "|" + CREATURES.map(c => `${c.id}:${c.where}:${c.mark === undefined ? "" : c.mark}:${hasQuiz(c) ? "q" : "n"}${c.stays ? "s" : ""}${c.gives || ""}`).join(",") +
    "|" + GATES.map(g => `${g.mark}:${[].concat(g.needs || []).join("+")}${hasQuiz(g) ? "q" : ""}${g.consume ? "c" : ""}${g.needsAllCreatures ? "a" : ""}`).join(",");
  let h = 5381;
  for (let i = 0; i < raw.length; i++) h = ((h * 33) ^ raw.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function loadBest() {
  // 格式不對、或簽章和目前的地圖不同,都當作沒有紀錄
  // (不檢查的話,STORAGE_KEY 撞名時會顯示 undefined,而且之後的最佳紀錄永遠不會被更新)
  try {
    const best = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (best && Number.isFinite(best.moves) && best.sig === bestSignature()) return best;
  } catch (e) { /* 讀不到或壞掉,當作沒有紀錄 */ }
  return null;
}
function saveBestIfNeeded(moves) {
  const best = loadBest();
  if (!best || moves < best.moves) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ moves, sig: bestSignature() })); } catch (e) {}
  }
}
function showBestNote() {
  const best = loadBest();
  el("best-note").textContent = best ? say("bestNote", { moves: best.moves }) : "";
}

/* ---------- 開始遊戲 ---------- */
function resetState() {
  state.grid = MAP.map(row => row.split(""));
  state.grid.forEach((row, y) => row.forEach((ch, x) => { if (ch === "@") { state.px = x; state.py = y; row[x] = "."; } }));
  Object.assign(state, { facing: "down", move: null, stepParity: 0, held: null, caughtCreatures: [], collectedItems: [], openedGates: [], usedItems: [], talked: [],
    attempts: {}, qTurn: {}, wrongCount: 0, grassSteps: 0, moveCount: 0, busy: false });
}
function startGame() {
  if (showMapErrors().length) return;
  state.playerName = el("player-name").value.trim() || "玩家";
  resetState();
  state.startTime = Date.now();
  el("screen-start").classList.add("hidden");
  el("screen-game").classList.remove("hidden");
  fitView();
  renderHud();
  state.running = true; last = 0;
  requestAnimationFrame(loop);
  const hasGrass = CREATURES.some(c => c.where === "grass");
  toast(say(hasGrass ? "startGrass" : "start"));
}

/* 畫面縮放:盡量用整數倍放大,像素才會整齊 */
function fitView() {
  const frame = el("stage");
  const portrait = window.innerWidth < 640 && window.innerHeight > window.innerWidth;
  const w = portrait ? 11 : 15, h = portrait ? 12 : 10;
  if (w !== VIEW_W || h !== VIEW_H) {
    VIEW_W = w; VIEW_H = h;
    view.width = VIEW_W * TILE; view.height = VIEW_H * TILE;
    el("enc-scene").width = view.width; el("enc-scene").height = view.height;
    vctx.imageSmoothingEnabled = false;
    el("stage").classList.toggle("portrait", portrait);
  }
  const pw = VIEW_W * TILE, ph = VIEW_H * TILE;
  const avail = el("screen-game").parentElement.clientWidth;
  const maxH = window.innerHeight - 250;
  const scale = Math.floor(Math.min(avail / pw, maxH / ph));
  if (scale >= 2) frame.style.width = (pw * Math.min(scale, 3) + 8) + "px";
  else frame.style.width = "100%";
  if (state.running) draw();
}

/* ---------- 操作 ---------- */
const KEY_DIR = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
function gameVisible() { return !el("screen-game").classList.contains("hidden"); }
document.addEventListener("keydown", (e) => {
  if (!gameVisible()) return;
  const key = e.key.toLowerCase();
  const dir = KEY_DIR[key];
  const confirm = key === "enter" || key === " " || key === "z";
  if (dir || confirm) e.preventDefault();
  if (enc.phase) {
    if (dir && enc.phase === "question") {
      const n = enc.order.length;
      if (dir === "up" || dir === "left") enc.sel = (enc.sel + n - 1) % n;
      if (dir === "down" || dir === "right") enc.sel = (enc.sel + 1) % n;
      highlightChoice();
    }
    if (confirm && !e.repeat) encounterConfirm();
    return;
  }
  if (dir) state.held = dir;
  if (confirm && !e.repeat && !state.busy) interact();
  if (key === "b" && !e.repeat) openBag();
});
document.addEventListener("keyup", (e) => {
  const dir = KEY_DIR[e.key.toLowerCase()];
  if (dir && state.held === dir) state.held = null;
});
window.addEventListener("blur", () => { state.held = null; clearPadHighlight(); });
function clearPadHighlight() { document.querySelectorAll("#dpad button").forEach(b => b.classList.remove("on")); }
document.querySelectorAll("#dpad button").forEach(b => {
  const on = (e) => { e.preventDefault(); if (enc.phase) { if (enc.phase === "question") { const n = enc.order.length; enc.sel = (enc.sel + (b.dataset.dir === "up" || b.dataset.dir === "left" ? n - 1 : 1)) % n; highlightChoice(); } return; } state.held = b.dataset.dir; b.classList.add("on"); };
  const off = () => { if (state.held === b.dataset.dir) state.held = null; b.classList.remove("on"); };
  b.addEventListener("pointerdown", on);
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, off));
});
el("btn-b").addEventListener("click", () => { if (enc.phase) encounterConfirm(); else openBag(); });
el("btn-a").addEventListener("click", () => { if (enc.phase) encounterConfirm(); else if (!state.busy) interact(); });
el("enc-box").addEventListener("click", () => { if (enc.phase === "intro" || enc.phase === "result" || enc.phase === "talk") encounterConfirm(); });
/* 遊戲進行中重新整理、關分頁或按上一頁,進度會消失(沒有存檔),所以先讓瀏覽器跳出確認視窗。
   視窗的文字由瀏覽器決定,改不了;開始畫面和結算畫面不會跳 */
window.addEventListener("beforeunload", (e) => {
  if (!gameVisible() || !state.running) return;
  e.preventDefault();
  e.returnValue = "";
});
el("btn-start").addEventListener("click", startGame);
el("player-name").addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });
el("btn-restart").addEventListener("click", () => {
  el("screen-end").classList.add("hidden");
  el("screen-start").classList.remove("hidden");
  el("submit-status").textContent = "";
  showBestNote();
});
window.addEventListener("resize", () => { if (gameVisible()) fitView(); });

/* ---------- 圖片預覽頁(網址加上 #sprites) ---------- */
function showGallery() {
  ["screen-start", "screen-game", "screen-end"].forEach(id => el(id).classList.add("hidden"));
  el("screen-gallery").classList.remove("hidden");
  const items = [];
  CREATURES.forEach(c => items.push([`角色:${c.name}`, gfxOf(c)]));
  ITEMS.forEach(i => items.push([`道具:${i.name}`, gfxOf(i)]));
  GATES.forEach(g => items.push([`門:${g.name}`, gfxOf(gateObj(g))]));
  Object.keys(SPRITES).forEach(n => items.push([n, GFX[n]]));
  Object.keys(TILES).forEach(n => items.push([`地形:${n}`, GFX["tile:" + n]]));
  el("gallery").innerHTML = items.map((_, i) => `<figure><canvas width="16" height="16" data-g="${i}"></canvas><figcaption>${escapeHtml(items[i][0])}</figcaption></figure>`).join("");
  el("gallery").querySelectorAll("canvas").forEach(cv => {
    const g = items[+cv.dataset.g][1];
    const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
    if (g) ctx.drawImage(g, 0, 0, 16, 16);
  });
}

/* ---------- 初始化 ---------- */
if (GAME.title) {
  el("game-title").textContent = GAME.title;
  document.title = GAME.title;     // 瀏覽器分頁的標題也跟著 GAME.title,不用另外改 <title>
}
if (GAME.desc) el("game-desc").textContent = GAME.desc;
if (GAME.teacherNotes) {
  el("teacher-notes-body").textContent = [].concat(GAME.teacherNotes).join("\n\n");
  el("teacher-notes").classList.remove("hidden");
}
window.__engineReady = true;   // 之後的錯誤不再由最上面的錯誤顯示處理
loadGraphics().then(() => {
  if (location.hash === "#sprites") { showGallery(); return; }
  drawLineup("lineup", true);
  showBestNote();
  showMapErrors();
});
</script>
</body>
